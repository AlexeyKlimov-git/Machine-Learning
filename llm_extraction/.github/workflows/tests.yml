name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      # Это реальный regression run, а не mocked ответ модели.
      # Все входы синтетические; внешние API с обращениями не вызываются.
      - run: python -m src.evaluate --backend rules --output artifacts/rules
      - run: python -m src.evaluate --backend qwen --mode zero --revision c1899de289a04d12100db370d81485cdf75e47ca --output artifacts/zero
      - run: python -m src.evaluate --backend qwen --mode few --revision c1899de289a04d12100db370d81485cdf75e47ca --output artifacts/few
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: artifacts/
